[project]
name = "ai-companion-workspace"
version = "0.0.0"
description = "AI Companion workspace foundation"
requires-python = "==3.12.10"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "jsonschema==4.26.0", "pytest==9.1.1", "ruff==0.16.8"]

[tool.uv]
package = false
required-version = "==0.12.17"

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".bootstrap", ".tmp", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
